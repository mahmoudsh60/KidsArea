<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الكيدز إريا - Amona City 🦆</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #eef2f5; --card-bg: #ffffff; --text: #1f2937; --primary: #3b82f6; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --custom: #facc15; }
        body { background: var(--bg); color: var(--text); font-family: 'Tajawal', sans-serif; margin: 0; padding: 10px; padding-bottom: 80px;}
        header { text-align: center; margin-bottom: 15px; border-bottom: 3px solid var(--primary); background: rgba(255,255,255,0.5); border-radius: 0 0 15px 15px; padding: 10px;}
        header h1 { margin: 0; color: var(--primary); font-weight: 900; font-size: 24px;}
        .add-section { background: var(--card-bg); padding: 15px; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);}
        .input-group { display: flex; gap: 5px; margin-bottom: 10px; }
        .input-group input { padding: 12px; border-radius: 10px; border: 2px solid #d1d5db; font-size: 16px; font-weight: bold; text-align: center; }
        #childNameInput { flex: 2; } #customMinutesInput { flex: 1; border-color: var(--custom); background: #fff3cd; color: #856404; }
        .btn-group { display: flex; gap: 8px; }
        .btn { flex: 1; padding: 12px 5px; border: none; border-radius: 10px; font-weight: bold; font-size: 14px; color: white; cursor: pointer; text-align: center;}
        .btn-15 { background: var(--primary); } .btn-60 { background: var(--success); } .btn-custom { background: var(--custom); color: #856404; }
        .kids-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .kid-card { padding: 10px; border-radius: 10px; color: white; display: flex; flex-direction: column; text-align: center; }
        .kid-name { font-size: 16px; font-weight: 900; margin: 0 0 5px; border-bottom: 1px dashed rgba(255,255,255,0.5); padding-bottom: 3px; }
        .kid-time { font-size: 26px; font-weight: 900; direction: ltr; margin: 5px 0;}
        .btn-remove { background: rgba(0,0,0,0.3); color: white; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: auto;}
        .state-good { background: var(--success); } .state-warning { background: var(--warning); color: #000; } .state-danger { background: var(--danger); } .state-received { background: #dc2626; } .state-archived { background: #6b7280; }
        .clear-all-btn { display: block; width: 100%; max-width: 250px; margin: 25px auto; border: 2px solid var(--danger); color: var(--danger); padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; background: transparent;}
        #loader { text-align: center; font-weight: bold; color: var(--primary); display: none; }
    </style>
</head>
<body>
    <header><h1>🦆 إدارة الكيدز إريا 🦆</h1></header>
    
    <div class="add-section">
        <input type="text" id="cashierName" placeholder="اسم الكاشير" style="width: 100%; margin-bottom: 10px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; text-align: center; font-weight: bold;">
        <div class="input-group">
            <input type="text" id="childNameInput" placeholder="اسم الطفل 🦆">
            <input type="number" id="customMinutesInput" placeholder="دقائق ⏰">
        </div>
        <div class="btn-group">
            <button class="btn btn-15" onclick="addChild(30)">نصف ساعة</button>
            <button class="btn btn-60" onclick="addChild(60)">ساعة كاملة</button>
            <button class="btn btn-custom" onclick="addCustomChild()">مخصوص</button>
        </div>
    </div>
    <div id="loader">جاري المزامنة مع الإكسيل... ⏳</div>
    <div class="kids-grid" id="kidsContainer"></div>
    <button class="clear-all-btn" onclick="clearAllKids()">🗑️ مسح الكل (نهاية اليوم)</button>
    <audio id="alarmAudio" src="https://actions.google.com/sounds/v1/notifications/dainty_chime.ogg" loop preload="auto"></audio>

    <script>
        const WEB_APP_URL = "ضع_الرابط_الجديد_هنا"; // ضع رابط السكريبت هنا
        let kids = [];
        
        async function fetchKids() {
            try {
                const response = await fetch(WEB_APP_URL + "?action=getKidsArea");
                const result = await response.json();
                if(result.success) { kids = result.data; renderKids(); }
            } catch(e) { console.log("خطأ في المزامنة"); }
        }

        async function syncAction(actionData) {
            document.getElementById('loader').style.display = 'block';
            await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(actionData) });
            await fetchKids();
            document.getElementById('loader').style.display = 'none';
        }

        function addChild(minutes) {
            const name = document.getElementById('childNameInput').value.trim();
            const cashier = document.getElementById('cashierName').value.trim() || "غير معروف";
            if (!name) return alert('الرجاء كتابة اسم الطفل!');
            
            const now = new Date();
            const endTime = new Date(now.getTime() + minutes * 60000);
            const kidId = name + " - " + Date.now().toString().slice(-4);

            const newKid = {
                id: kidId, duration: minutes, status: 'active', cashier: cashier,
                endTimeFormatted: endTime.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
            };

            syncAction({ action: 'addKid', kid: newKid });
            document.getElementById('childNameInput').value = '';
        }

        function addCustomChild() {
            const min = parseInt(document.getElementById('customMinutesInput').value);
            if(min > 0) addChild(min);
        }

        function updateKidState(id, newStatus) {
            const kid = kids.find(k => k.id === id);
            if (kid) {
                kid.status = newStatus;
                if(newStatus === 'active') { // استئناف
                    let pausedDiff = kid.endTimeStamp - Date.now();
                    let newEnd = new Date(Date.now() + pausedDiff);
                    kid.endTimeFormatted = newEnd.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
                }
                syncAction({ action: 'updateKid', kid: kid });
            }
        }

        function clearAllKids() {
            if(confirm("مسح جميع البيانات من الشيت؟")) syncAction({ action: 'clearKids' });
        }

        function renderKids() {
            const container = document.getElementById('kidsContainer');
            const alarm = document.getElementById('alarmAudio');
            let html = '';
            let isAlarmNeeded = false;
            const now = Date.now();

            kids.forEach(kid => {
                if(kid.status === 'archived') return; // لا نعرض المؤرشف
                
                let stateClass = 'state-good';
                let timeDisplay = '';
                let btnHtml = '';

                if(kid.status === 'received') {
                    stateClass = 'state-received';
                    timeDisplay = '⏸️ مستلم';
                    btnHtml = `<div style="display:flex; gap:5px; margin-top: auto;">
                                <button class="btn-remove" style="background:#facc15; color:#000;" onclick="updateKidState('${kid.id}', 'active')">استئناف</button>
                                <button class="btn-remove" style="background:#7f1d1d;" onclick="updateKidState('${kid.id}', 'archived')">إنهاء 🔒</button>
                               </div>`;
                } else {
                    let timeLeft = kid.endTimeStamp - now;
                    if(timeLeft <= 0) {
                        stateClass = 'state-danger'; timeDisplay = '❌ انتهى!'; isAlarmNeeded = true;
                    } else {
                        let m = Math.floor((timeLeft % 3600000) / 60000);
                        let s = Math.floor((timeLeft % 60000) / 1000);
                        timeDisplay = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                        if(m < 5) stateClass = 'state-warning';
                    }
                    btnHtml = `<button class="btn-remove" onclick="updateKidState('${kid.id}', 'received')">استلام ✔️</button>`;
                }

                html += `
                    <div class="kid-card ${stateClass}">
                        <h3 class="kid-name">${kid.name}</h3>
                        <div class="kid-time">${timeDisplay}</div>
                        <div style="font-size:11px; margin-bottom:10px;">خروج: ${kid.endTimeFormatted}</div>
                        ${btnHtml}
                    </div>`;
            });

            container.innerHTML = html;
            if (isAlarmNeeded && alarm.paused) alarm.play();
            if (!isAlarmNeeded) { alarm.pause(); alarm.currentTime = 0; }
        }

        // تحديث البيانات كل 5 ثواني
        setInterval(fetchKids, 5000);
        setInterval(renderKids, 1000); // تحديث التايمر المحلي
        fetchKids();
    </script>
</body>
</html>
